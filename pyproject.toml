[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "decode-easyae-dta"
dynamic = ["version"]
description = "Decode AEwin64 / EasyAE DTA hit and time-driven data and export CSV"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stephen Pierson" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["acoustic-emission", "EasyAE", "AEwin64", "MISTRAS", "DTA"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["build>=1.2", "hatchling>=1.26", "twine>=6"]

[project.urls]
Homepage = "https://github.com/spier16/decode-easyae-dta"
Source = "https://github.com/spier16/decode-easyae-dta"
Issues = "https://github.com/spier16/decode-easyae-dta/issues"
Changelog = "https://github.com/spier16/decode-easyae-dta/blob/main/CHANGELOG.md"

[project.scripts]
decode-easyae-dta = "decode_easyae_dta:main"

[tool.hatch.version]
path = "decode_easyae_dta.py"

[tool.hatch.build.targets.wheel]
include = ["/decode_easyae_dta.py", "/mistras_dta.py"]

[tool.hatch.build.targets.sdist]
include = [
  "/decode_easyae_dta.py",
  "/mistras_dta.py",
  "/test_mistras_dta.py",
  "/validate_mistras_dta.py",
  "/survey_mistras_dta.py",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/pyproject.toml",
]
